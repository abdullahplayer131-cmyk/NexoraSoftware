<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Nexora</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body class="admin-body"><main class="admin-login"><a class="brand" href="/"><span class="brand-mark">N</span><span>NEXORA<small>SOFTWARE</small></span></a><h1>Admin access</h1><p>Sign in to manage your catalogue and review orders.</p>{% with messages = get_flashed_messages() %}{% for message in messages %}<div class="notice">{{message}}</div>{% endfor %}{% endwith %}<form action="/admin/login" method="post"><label>Admin password<input type="password" name="password" required autofocus></label><button class="btn full">Sign in →</button></form><a class="back-link" href="/">← Back to store</a><p class="fine-print">Change the demo password in your environment before using this beyond local testing.</p></main></body></html>
